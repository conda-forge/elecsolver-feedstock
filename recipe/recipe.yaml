schema_version: 1

context:
  name: elecsolver
  version: 2.2.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/williampiat3/ElecSolver/archive/refs/tags/${{ version }}.tar.gz
  sha256: ecf8f60ce02c7cec5fa7555d1664fe6d69b159007caa9ca4b10b77b1e6677715



build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv
  number: 0

requirements:
  host:
    - setuptools >=60
    - setuptools-scm >=8.0
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - ElecSolver
  - script:
      - python -m pytest tests
    requirements:
      run:
        - python ${{ python_min }}.*
        - python-mumps
        - pytest
        - networkx
    files:
      source:
        - tests

about:
  homepage: https://github.com/williampiat3/ElecSolver
  summary: Electric system formulation in Python
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - williampiat3
    - Pimss
